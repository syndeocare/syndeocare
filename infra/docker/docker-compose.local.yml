services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: syndeocare
      POSTGRES_USER: syndeocare
      POSTGRES_PASSWORD: syndeocare
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  keycloak:
    image: keycloak/keycloak:26.2.2
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: syndeocare
      KC_DB_USERNAME: syndeocare
      KC_DB_PASSWORD: syndeocare
    depends_on:
      - postgres
    ports:
      - "${KEYCLOAK_HTTP_PORT:-8180}:8080"
    volumes:
      - ../keycloak/realm-import:/opt/keycloak/data/import:ro

  localstack:
    image: localstack/localstack:4.0
    environment:
      SERVICES: sqs,eventbridge,s3,ssm,secretsmanager
      DEBUG: 0
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack

  nats:
    image: nats:2.10-alpine
    command:
      - "--jetstream"
      - "--http_port=8222"
    ports:
      - "4222:4222"
      - "8222:8222"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  localstack-data:
  minio-data:
  redis-data:
