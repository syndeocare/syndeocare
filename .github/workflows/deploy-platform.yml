name: Deploy Platform

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: ${{ inputs.environment }}
    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_api_public_base_url: ${{ vars.API_PUBLIC_BASE_URL }}
      TF_VAR_platform_api_image: ${{ vars.PLATFORM_API_IMAGE }}
      TF_VAR_api_gateway_image: ${{ vars.API_GATEWAY_IMAGE }}
      TF_VAR_identity_image: ${{ vars.IDENTITY_IMAGE }}
      TF_VAR_profiles_image: ${{ vars.PROFILES_IMAGE }}
      TF_VAR_clinics_image: ${{ vars.CLINICS_IMAGE }}
      TF_VAR_scheduling_image: ${{ vars.SCHEDULING_IMAGE }}
      TF_VAR_notifications_image: ${{ vars.NOTIFICATIONS_IMAGE }}
      TF_VAR_keycloak_base_url: ${{ vars.KEYCLOAK_BASE_URL }}
      TF_VAR_keycloak_admin_username: ${{ vars.KEYCLOAK_ADMIN_USERNAME }}
      TF_VAR_keycloak_admin_password: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
      TF_VAR_keycloak_admin_realm: ${{ vars.KEYCLOAK_ADMIN_REALM }}
      TF_VAR_keycloak_public_client_id: ${{ vars.KEYCLOAK_PUBLIC_CLIENT_ID }}
      TF_VAR_auth_api_client_id: ${{ vars.AUTH_API_CLIENT_ID }}
      TF_VAR_auth_realm: ${{ vars.AUTH_REALM }}
      TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY }}
      TF_VAR_resend_from_email: ${{ vars.RESEND_FROM_EMAIL }}
      TF_VAR_resend_test_email: ${{ vars.RESEND_TEST_EMAIL }}
      TF_VAR_storage_access_key_id: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
      TF_VAR_storage_secret_access_key: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
      TF_VAR_storage_region: ${{ vars.STORAGE_REGION }}
      TF_VAR_storage_public_bucket: ${{ vars.STORAGE_PUBLIC_BUCKET }}
      TF_VAR_storage_private_bucket: ${{ vars.STORAGE_PRIVATE_BUCKET }}
      TF_VAR_storage_public_base_url: ${{ vars.STORAGE_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Build services
        run: pnpm build:services

      - name: Build web frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_DOCS_URL: ${{ vars.NEXT_PUBLIC_DOCS_URL }}
          NEXT_PUBLIC_ANDROID_APP_URL: ${{ vars.NEXT_PUBLIC_ANDROID_APP_URL }}
          NEXT_PUBLIC_SITE_BASE_PATH: ${{ vars.NEXT_PUBLIC_SITE_BASE_PATH }}
        run: pnpm build:web

      - name: Upload web frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-frontend-${{ inputs.environment }}
          path: apps/web/out
          if-no-files-found: error

      - name: Sync web frontend to S3
        if: ${{ vars.WEB_FRONTEND_BUCKET != '' }}
        run: aws s3 sync apps/web/out "s3://${{ vars.WEB_FRONTEND_BUCKET }}" --delete

      - name: Terraform init
        working-directory: infra/terraform/environments/${{ inputs.environment }}
        run: terraform init

      - name: Terraform validate
        working-directory: infra/terraform/environments/${{ inputs.environment }}
        run: terraform validate

      - name: Terraform plan
        working-directory: infra/terraform/environments/${{ inputs.environment }}
        run: terraform plan -out=tfplan

      - name: Terraform apply
        working-directory: infra/terraform/environments/${{ inputs.environment }}
        run: terraform apply -auto-approve tfplan

      - name: Invalidate CloudFront
        if: ${{ vars.WEB_FRONTEND_DISTRIBUTION_ID != '' }}
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.WEB_FRONTEND_DISTRIBUTION_ID }}" --paths "/*"
