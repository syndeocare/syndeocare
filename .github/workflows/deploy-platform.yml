name: Deploy Platform

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "services/**"
      - "packages/**"
      - "infra/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-platform.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Target deployment environment
        required: true
        type: choice
        default: production
        options:
          - dev
          - staging
          - production
      deploy_backend:
        description: Run backend ECS/Terraform deployment when BACKEND_DEPLOY_MODE=ecs
        required: true
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_GITHUB_ACTIONS_ROLE_ARN: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
      API_PUBLIC_BASE_URL: ${{ vars.API_PUBLIC_BASE_URL }}
      AUTH_API_CLIENT_ID: ${{ vars.AUTH_API_CLIENT_ID }}
      AUTH_REALM: ${{ vars.AUTH_REALM }}
      KEYCLOAK_ADMIN_REALM: ${{ vars.KEYCLOAK_ADMIN_REALM }}
      KEYCLOAK_ADMIN_USERNAME: ${{ vars.KEYCLOAK_ADMIN_USERNAME }}
      KEYCLOAK_BASE_URL: ${{ vars.KEYCLOAK_BASE_URL }}
      KEYCLOAK_PUBLIC_CLIENT_ID: ${{ vars.KEYCLOAK_PUBLIC_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
      RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
      RESEND_TEST_EMAIL: ${{ vars.RESEND_TEST_EMAIL }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION }}
      STORAGE_PUBLIC_BUCKET: ${{ vars.STORAGE_PUBLIC_BUCKET }}
      STORAGE_PRIVATE_BUCKET: ${{ vars.STORAGE_PRIVATE_BUCKET }}
      STORAGE_PUBLIC_BASE_URL: ${{ vars.STORAGE_PUBLIC_BASE_URL }}
      VITE_API_GATEWAY_BASE_URL: ${{ vars.VITE_API_GATEWAY_BASE_URL }}
      VITE_PLATFORM_API_BASE_URL: ${{ vars.VITE_PLATFORM_API_BASE_URL }}
      VITE_EMAIL_VERIFICATION_REQUIRED: ${{ vars.VITE_EMAIL_VERIFICATION_REQUIRED }}
      WEB_FRONTEND_BUCKET: ${{ vars.WEB_FRONTEND_BUCKET }}
      WEB_FRONTEND_DISTRIBUTION_ID: ${{ vars.WEB_FRONTEND_DISTRIBUTION_ID }}
      WEB_PUBLIC_URL: ${{ vars.WEB_PUBLIC_URL }}
      BACKEND_DEPLOY_MODE: ${{ vars.BACKEND_DEPLOY_MODE }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deployment context
        id: context
        run: |
          set -euo pipefail

          target="${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}"
          terraform_env="$target"
          if [[ "$target" == "production" ]]; then
            terraform_env="prod"
          fi

          deploy_backend="${{ github.event_name == 'workflow_dispatch' && inputs.deploy_backend || false }}"
          if [[ "${BACKEND_DEPLOY_MODE:-}" == "ecs" && "${{ github.event_name }}" == "push" ]]; then
            deploy_backend="true"
          fi

          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "terraform_env=$terraform_env" >> "$GITHUB_OUTPUT"
          echo "deploy_backend=$deploy_backend" >> "$GITHUB_OUTPUT"
          echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository
        run: pnpm validate

      - name: Build repository
        run: pnpm build

      - name: Smoke test web artifact
        run: pnpm smoke:web

      - name: Verify AWS deployment settings
        run: |
          set -euo pipefail
          test -n "${AWS_REGION:-}" || {
            echo "AWS_REGION must be configured on the GitHub environment."
            exit 1
          }
          test -n "${AWS_GITHUB_ACTIONS_ROLE_ARN:-}" || {
            echo "AWS_GITHUB_ACTIONS_ROLE_ARN must be configured on the GitHub environment."
            exit 1
          }
          test -n "${WEB_FRONTEND_BUCKET:-}" || {
            echo "WEB_FRONTEND_BUCKET must be configured on the GitHub environment."
            exit 1
          }
          test -n "${WEB_FRONTEND_DISTRIBUTION_ID:-}" || {
            echo "WEB_FRONTEND_DISTRIBUTION_ID must be configured on the GitHub environment."
            exit 1
          }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build web frontend
        run: pnpm build:web

      - name: Upload web frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-frontend-${{ steps.context.outputs.target }}-${{ github.sha }}
          path: apps/web/dist
          if-no-files-found: error

      - name: Sync immutable frontend assets
        run: |
          aws s3 sync apps/web/dist/assets "s3://${WEB_FRONTEND_BUCKET}/assets" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Sync frontend shell
        run: |
          aws s3 sync apps/web/dist "s3://${WEB_FRONTEND_BUCKET}" \
            --delete \
            --exclude "assets/*" \
            --cache-control "no-store,no-cache,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${WEB_FRONTEND_DISTRIBUTION_ID}" \
            --paths "/*"

      - name: Smoke test deployed frontend
        run: |
          set -euo pipefail
          public_url="${WEB_PUBLIC_URL:-https://syndeocare.ai}"
          curl -fsSIL --retry 5 --retry-delay 5 --max-time 20 "$public_url" >/dev/null

      - name: Setup Terraform
        if: ${{ steps.context.outputs.deploy_backend == 'true' && vars.BACKEND_DEPLOY_MODE == 'ecs' }}
        uses: hashicorp/setup-terraform@v3

      - name: Build and push service image
        if: ${{ steps.context.outputs.deploy_backend == 'true' && vars.BACKEND_DEPLOY_MODE == 'ecs' }}
        id: service_images
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          infra/scripts/build-and-push-images.sh \
            "${{ steps.context.outputs.terraform_env }}" \
            "${{ steps.context.outputs.image_tag }}" | tee /tmp/syndeocare-images.env

          while IFS='=' read -r key value; do
            lower="$(printf '%s' "$key" | tr '[:upper:]' '[:lower:]')"
            echo "TF_VAR_${lower}=$value" >> "$GITHUB_ENV"
          done < /tmp/syndeocare-images.env

      - name: Terraform init
        if: ${{ steps.context.outputs.deploy_backend == 'true' && vars.BACKEND_DEPLOY_MODE == 'ecs' }}
        working-directory: infra/terraform/environments/${{ steps.context.outputs.terraform_env }}
        run: terraform init -input=false

      - name: Terraform validate
        if: ${{ steps.context.outputs.deploy_backend == 'true' && vars.BACKEND_DEPLOY_MODE == 'ecs' }}
        working-directory: infra/terraform/environments/${{ steps.context.outputs.terraform_env }}
        run: terraform validate

      - name: Terraform plan
        if: ${{ steps.context.outputs.deploy_backend == 'true' && vars.BACKEND_DEPLOY_MODE == 'ecs' }}
        working-directory: infra/terraform/environments/${{ steps.context.outputs.terraform_env }}
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_api_public_base_url: ${{ vars.API_PUBLIC_BASE_URL }}
          TF_VAR_web_public_url: ${{ vars.WEB_PUBLIC_URL }}
          TF_VAR_keycloak_base_url: ${{ vars.KEYCLOAK_BASE_URL }}
          TF_VAR_keycloak_admin_username: ${{ vars.KEYCLOAK_ADMIN_USERNAME }}
          TF_VAR_keycloak_admin_password: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          TF_VAR_keycloak_admin_realm: ${{ vars.KEYCLOAK_ADMIN_REALM }}
          TF_VAR_keycloak_public_client_id: ${{ vars.KEYCLOAK_PUBLIC_CLIENT_ID }}
          TF_VAR_auth_api_client_id: ${{ vars.AUTH_API_CLIENT_ID }}
          TF_VAR_auth_realm: ${{ vars.AUTH_REALM }}
          TF_VAR_google_oauth_client_id: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          TF_VAR_google_oauth_client_secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY }}
          TF_VAR_resend_from_email: ${{ vars.RESEND_FROM_EMAIL }}
          TF_VAR_resend_test_email: ${{ vars.RESEND_TEST_EMAIL }}
          TF_VAR_storage_access_key_id: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
          TF_VAR_storage_secret_access_key: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
          TF_VAR_storage_region: ${{ vars.STORAGE_REGION }}
          TF_VAR_storage_public_bucket: ${{ vars.STORAGE_PUBLIC_BUCKET }}
          TF_VAR_storage_private_bucket: ${{ vars.STORAGE_PRIVATE_BUCKET }}
          TF_VAR_storage_public_base_url: ${{ vars.STORAGE_PUBLIC_BASE_URL }}
          TF_VAR_route53_zone_name: ${{ vars.ROUTE53_ZONE_NAME }}
          TF_VAR_api_domain_name: ${{ vars.API_DOMAIN_NAME }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: ${{ steps.context.outputs.deploy_backend == 'true' && vars.BACKEND_DEPLOY_MODE == 'ecs' }}
        working-directory: infra/terraform/environments/${{ steps.context.outputs.terraform_env }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Run database migrations and seeders
        if: ${{ steps.context.outputs.deploy_backend == 'true' && vars.BACKEND_DEPLOY_MODE == 'ecs' }}
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: infra/scripts/run-db-bootstrap.sh "${{ steps.context.outputs.terraform_env }}"

      - name: Smoke test deployed API gateway
        if: ${{ steps.context.outputs.deploy_backend == 'true' && vars.BACKEND_DEPLOY_MODE == 'ecs' }}
        run: |
          set -euo pipefail

          api_base="${API_PUBLIC_BASE_URL:-https://api.syndeocare.ai}"
          api_base="${api_base%/}/v1"

          check_route() {
            local method="$1"
            local path="$2"
            local payload="${3:-{}}"
            local body_file
            local status
            body_file="$(mktemp)"

            status="$(
              curl -sS -o "$body_file" -w "%{http_code}" \
                --retry 5 \
                --retry-delay 5 \
                --max-time 20 \
                -X "$method" \
                -H "content-type: application/json" \
                -d "$payload" \
                "${api_base}${path}"
            )"

            if [[ "$status" == "404" ]]; then
              echo "Expected ${method} ${api_base}${path} to be registered, got 404:"
              cat "$body_file"
              exit 1
            fi

            if [[ "$status" == "000" || "$status" =~ ^5 ]]; then
              echo "Expected ${method} ${api_base}${path} to be reachable, got ${status}:"
              cat "$body_file"
              exit 1
            fi
          }

          check_route "POST" "/conversations" "{}"
          check_route "PATCH" "/bookings/smoke-test-booking" '{"status":"accepted"}'
