name: Deploy Platform

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build services
        run: pnpm build:services

      - name: Build web frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_DOCS_URL: ${{ vars.NEXT_PUBLIC_DOCS_URL }}
          NEXT_PUBLIC_ANDROID_APP_URL: ${{ vars.NEXT_PUBLIC_ANDROID_APP_URL }}
          NEXT_PUBLIC_SITE_BASE_PATH: ${{ vars.NEXT_PUBLIC_SITE_BASE_PATH }}
        run: pnpm build:web

      - name: Upload web frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-frontend-${{ inputs.environment }}
          path: apps/web/out
          if-no-files-found: error

      - name: Sync web frontend to S3
        if: ${{ vars.WEB_FRONTEND_BUCKET != '' }}
        run: aws s3 sync apps/web/out "s3://${{ vars.WEB_FRONTEND_BUCKET }}" --delete

      - name: Deployment placeholder
        run: |
          echo "Hook Docker build, ECR push, Terraform apply, CloudFront invalidation, and ECS rollout here."
