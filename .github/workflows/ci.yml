name: CI

on:
  pull_request:
    paths-ignore:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths-ignore:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"
      - "pnpm-lock.yaml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm validate

      - name: Build
        run: pnpm build

      - name: Smoke test web artifact
        run: pnpm smoke:web

  changeset-status:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure release metadata exists
        run: pnpm exec changeset status --since=origin/main
