name: iOS App Store Screenshots

on:
  workflow_dispatch:
    inputs:
      simulator_build_url:
        description: EAS iOS simulator .tar.gz artifact URL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-app-store-screenshots
  cancel-in-progress: true

jobs:
  capture:
    name: Capture iPhone screenshots
    runs-on: macos-15
    timeout-minutes: 30
    env:
      APP_ID: ai.syndeocare.mobile
      DEVICE_NAME: SyndeoCare App Store
      REVIEW_EMAIL: ${{ secrets.APP_REVIEW_CLINIC_EMAIL }}
      REVIEW_PASSWORD: ${{ secrets.APP_REVIEW_CLINIC_PASSWORD }}
      SIMULATOR_BUILD_URL: ${{ inputs.simulator_build_url }}
      SCREENSHOT_LANGUAGE: en
    steps:
      - uses: actions/checkout@v4

      - name: Download simulator build
        run: |
          mkdir -p "$RUNNER_TEMP/syndeocare-build"
          curl --fail --location --retry 3 --retry-all-errors \
            "$SIMULATOR_BUILD_URL" \
            --output "$RUNNER_TEMP/syndeocare-build/app.tar.gz"
          tar -xzf "$RUNNER_TEMP/syndeocare-build/app.tar.gz" \
            -C "$RUNNER_TEMP/syndeocare-build"

          app_path="$(find "$RUNNER_TEMP/syndeocare-build" -type d -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "No .app bundle was found in the EAS simulator artifact."
            exit 1
          fi
          echo "APP_PATH=$app_path" >> "$GITHUB_ENV"

      - name: Create and boot App Store simulator
        run: |
          device_type="$(
            xcrun simctl list devicetypes -j |
              jq -r '.devicetypes[] | select(.name == "iPhone 14 Plus") | .identifier' |
              head -n 1
          )"
          runtime="$(
            xcrun simctl list runtimes -j |
              jq -r '[.runtimes[] | select(.platform == "iOS" and .isAvailable == true)] | last | .identifier'
          )"

          if [ -z "$device_type" ] || [ "$device_type" = "null" ]; then
            echo "The iPhone 14 Plus simulator device type is unavailable."
            exit 1
          fi
          if [ -z "$runtime" ] || [ "$runtime" = "null" ]; then
            echo "No available iOS simulator runtime was found."
            exit 1
          fi

          udid="$(xcrun simctl create "$DEVICE_NAME" "$device_type" "$runtime")"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          open -a Simulator
          xcrun simctl bootstatus "$udid" -b

      - name: Install and launch SyndeoCare
        run: |
          if [ "$SCREENSHOT_LANGUAGE" = "ar" ]; then
            locale="ar_YE"
            language="ar"
          else
            locale="en_US"
            language="en"
          fi

          xcrun simctl spawn "$SIMULATOR_UDID" defaults write NSGlobalDomain \
            AppleLanguages -array "$language"
          xcrun simctl spawn "$SIMULATOR_UDID" defaults write NSGlobalDomain \
            AppleLocale -string "$locale"

          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"
          xcrun simctl spawn "$SIMULATOR_UDID" defaults write "$APP_ID" \
            AppleLanguages -array "$language"
          xcrun simctl spawn "$SIMULATOR_UDID" defaults write "$APP_ID" \
            AppleLocale -string "$locale"
          xcrun simctl status_bar "$SIMULATOR_UDID" override \
            --time "9:41" \
            --batteryState charged \
            --batteryLevel 100 \
            --wifiBars 3 \
            --cellularBars 4
          xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" \
            "$APP_ID" \
            -AppleLanguages "($language)" \
            -AppleLocale "$locale"
          sleep 12

      - name: Require review credentials
        run: |
          if [ -z "$REVIEW_EMAIL" ] || [ -z "$REVIEW_PASSWORD" ]; then
            echo "The dedicated clinic review credentials are not configured."
            exit 1
          fi

      - name: Install Maestro
        run: |
          brew tap mobile-dev-inc/tap
          brew install mobile-dev-inc/tap/maestro
          maestro --version

      - name: Capture authenticated product screenshots
        working-directory: apps/mobile
        run: |
          mkdir -p screenshots
          maestro --device "$SIMULATOR_UDID" test \
            --test-output-dir screenshots/maestro-output \
            -e REVIEW_EMAIL="$REVIEW_EMAIL" \
            -e REVIEW_PASSWORD="$REVIEW_PASSWORD" \
            .maestro/app-store-clinic.yml

      - name: Validate screenshots
        working-directory: apps/mobile
        run: |
          count=0
          while IFS= read -r -d '' output; do
            width="$(sips -g pixelWidth "$output" | awk '/pixelWidth/ { print $2 }')"
            height="$(sips -g pixelHeight "$output" | awk '/pixelHeight/ { print $2 }')"
            if [ "$width" != "1284" ] || [ "$height" != "2778" ]; then
              echo "Unexpected screenshot size for $output: ${width}x${height}; expected 1284x2778."
              exit 1
            fi
            count=$((count + 1))
          done < <(find screenshots -maxdepth 1 -name '*.png' -print0)

          if [ "$count" -lt 4 ]; then
            echo "Expected four authenticated screenshots; found $count."
            exit 1
          fi

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-store-screenshots-en
          path: apps/mobile/screenshots/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload Maestro diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshot-maestro-diagnostics
          path: apps/mobile/screenshots/maestro-output
          if-no-files-found: ignore
          retention-days: 7

      - name: Shut down simulator
        if: always()
        run: |
          if [ -n "${SIMULATOR_UDID:-}" ]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" || true
            xcrun simctl delete "$SIMULATOR_UDID" || true
          fi
